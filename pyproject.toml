[project]
name = "vclogic-web-application"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "vclogic-vc-agentic-assessment>=0.1.0,<0.2",
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
embeddings = ["vclogic-vc-agentic-assessment[embeddings]>=0.1.0,<0.2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]

[project.scripts]
vc-clone-web = "vclogic_web.cli:main"

[tool.uv.sources]
vclogic-vc-agentic-assessment = { path = "../vclogic-vc-agentic-assessment", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vclogic_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
